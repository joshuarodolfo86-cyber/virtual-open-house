<!DOCTYPE html>
<html>
  <head>
    <title>Virtual Campus Open House</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #ai-ui {
        position: absolute;
        bottom: 15px;
        left: 15px;
        z-index: 999;
        background: rgba(255, 255, 255, 0.95);
        padding: 12px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      #ai-input { width: 180px; padding: 4px; }
      button { padding: 4px 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- AI Tour Guide Widget (Part F) -->
    <div id="ai-ui">
      <strong>Ask AI Tour Guide</strong><br><br>
      <input type="text" id="ai-input" placeholder="Ask about campus...">
      <button onclick="askGuide()">Ask</button>
      <p id="ai-response" style="max-width: 240px; font-size: 13px; color: #333; margin-top: 8px;"></p>
    </div>

    <!-- VR Scene (Part B & C) -->
    <a-scene>
      <a-sky color="#87CEEB"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#7BC8A4"></a-plane>
      <a-light type="ambient" color="#666"></a-light>
      <a-light type="directional" position="-1 2 1" intensity="0.8"></a-light>

      <!-- Camera & Cursor -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera id="camera">
          <a-cursor color="yellow" raycaster="objects: .clickable"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Buildings Container -->
      <a-entity id="buildings-container"></a-entity>

      <!-- VR Info Panel UI -->
      <a-entity id="info-panel" position="0 2 -3" visible="false">
        <a-plane color="#111" opacity="0.9" width="3.2" height="1.6"></a-plane>
        <a-text id="panel-title" value="" align="center" position="0 0.4 0.1" width="4" color="#FFD700"></a-text>
        <a-text id="panel-desc" value="" align="center" position="0 0 0.1" width="2.6" color="#FFF"></a-text>
        <a-box id="close-btn" class="clickable" position="0 -0.5 0.1" scale="0.8 0.25 0.1" color="#E74C3C">
          <a-text value="CLOSE" align="center" position="0 0 0.6" scale="0.5 0.5 0.5" color="#FFF"></a-text>
        </a-box>
      </a-entity>
    </a-scene>

    <script>
      async function init() {
        const res = await fetch('/api/hotspots');
        const hotspots = await res.json();
        const container = document.getElementById('buildings-container');

        hotspots.forEach(h => {
          const group = document.createElement('a-entity');
          group.setAttribute('position', h.position);

          // Building Box
          const box = document.createElement('a-box');
          box.setAttribute('color', h.color);
          box.setAttribute('height', '2');
          box.setAttribute('class', 'clickable');

          // Hover Animations (Part C)
          box.setAttribute('animation__mouseenter', 'property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200');
          box.setAttribute('animation__mouseleave', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200');

          // Click Event: Open Panel & Log Visit (Part C & D)
          box.addEventListener('click', () => {
            document.getElementById('panel-title').setAttribute('value', h.name);
            document.getElementById('panel-desc').setAttribute('value', h.description);
            document.getElementById('info-panel').setAttribute('visible', 'true');
            fetch('/api/visits', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ hotspotId: h.id })
            });
          });

          // Floating Label (Part B)
          const label = document.createElement('a-text');
          label.setAttribute('value', h.name);
          label.setAttribute('position', '0 1.5 0');
          label.setAttribute('align', 'center');

          // Teleport Pad (Part C)
          const pad = document.createElement('a-cylinder');
          pad.setAttribute('position', '0 -0.9 1.5');
          pad.setAttribute('radius', '0.5');
          pad.setAttribute('height', '0.05');
          pad.setAttribute('color', '#333');
          pad.setAttribute('class', 'clickable');
          pad.addEventListener('click', () => {
            const pos = h.position.split(' ').map(Number);
            document.getElementById('rig').setAttribute('position', `${pos[0]} 1.6 ${pos[2] + 2.5}`);
          });

          group.appendChild(box);
          group.appendChild(label);
          group.appendChild(pad);
          container.appendChild(group);
        });

        document.getElementById('close-btn').addEventListener('click', () => {
          document.getElementById('info-panel').setAttribute('visible', 'false');
        });
      }

      async function askGuide() {
        const question = document.getElementById('ai-input').value;
        if(!question) return;
        document.getElementById('ai-response').innerText = "Thinking...";
        const res = await fetch('/api/ask-guide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        document.getElementById('ai-response').innerText = data.answer;
      }

      init();
    </script>
  </body>
</html>
